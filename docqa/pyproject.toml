[project]
name = "docqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafal01010" }
]
requires-python = ">=3.13"
dependencies = [
    "addict>=2.4.0",
    "dots-ocr",
    "easydict>=1.13",
    "einops>=0.8.1",
    "mlx-vlm>=0.3.5",
    "olmocr>=0.4.0",
    "pillow>=11.3.0",
    "pymupdf>=1.26.5",
    "python-docx>=1.2.0",
    "setuptools>=80.9.0",
    "tokenizers>=0.22.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.55.2",
]

[project.scripts]
docqa = "docqa:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
  "transformers>=4.55,<5",
  "flash-attn==2.8.0.post2 ; sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.uv.sources]
dots-ocr = { git = "https://github.com/rednote-hilab/dots.ocr.git", rev = "master" }

[project.optional-dependencies]
cuda = ["flash-attn==2.8.0.post2"]
